<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Parqueadero</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.875rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .status-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger);
        }

        .dot.connected {
            background-color: var(--success);
        }

        button {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 12px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: #15803d; }

        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: #b91c1c; }

        .btn-secondary { background-color: #e5e7eb; color: var(--text-main); }
        .btn-secondary:hover { background-color: #d1d5db; }

        .grid-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dashboard-counter {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .counter-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .counter-card span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .counter-card strong {
            font-size: 1.75rem;
            color: var(--text-main);
        }

        #logEstado {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Control de Acceso Vehicular</h1>
        <div class="subtitle">Gestión Automatizada de Parqueadero</div>

        <!-- Estado de Conexión -->
        <div class="status-box">
            <div class="status-indicator">
                <div id="dotStatus" class="dot"></div>
                <span id="textConexion">Desconectado</span>
            </div>
            <button id="btnConectar" class="btn-primary" style="width: auto; margin:0; padding: 8px 14px; font-size: 0.85rem;" onclick="toggleConexion()">Conectar</button>
        </div>

        <!-- Conteo de Vehículos -->
        <div class="section-title">Telemetría de Ocupación</div>
        <div class="dashboard-counter">
            <div class="counter-card">
                <span>Vehículos Entrados</span>
                <strong id="valEntradas">0</strong>
            </div>
            <div class="counter-card">
                <span>Vehículos Salidos</span>
                <strong id="valSalidas">0</strong>
            </div>
        </div>

        <!-- Control de Motores (Barrera / Puerta) -->
        <div class="section-title">Acciones de Mecanismo</div>
        <div class="grid-controls">
            <button class="btn-success" onclick="enviarComando('barrera_abrir')">Abrir Barrera</button>
            <button class="btn-danger" onclick="enviarComando('barrera_cerrar')">Cerrar Barrera</button>
        </div>

        <button class="btn-secondary" onclick="enviarComando('sistema_reset')">Detener Todo</button>

        <!-- Registro de Actividad -->
        <div class="section-title" style="margin-top: 16px;">Consola de Estado</div>
        <div id="logEstado">Esperando conexión con el hardware...</div>
    </div>

    <script>
        let bluetoothDevice;
        let bluetoothCharacteristic;
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26aae";

        async function toggleConexion() {
            if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                try {
                    document.getElementById('logEstado').innerText = "Buscando sistema del parqueadero...";
                    
                    // --- FILTRO ESTRICTO: SOLO BUSCA LA PLACA ESP32 ---
                    bluetoothDevice = await navigator.bluetooth.requestDevice({
                        filters: [{
                            name: 'PARQUEADERO_STARK'
                        }],
                        optionalServices: [SERVICE_UUID]
                    });

                    const server = await bluetoothDevice.gatt.connect();
                    const service = await server.getPrimaryService(SERVICE_UUID);
                    bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                    // Preparación para escuchar los sensores en el futuro
                    await bluetoothCharacteristic.startNotifications();
                    bluetoothCharacteristic.addEventListener('characteristicvaluechanged', manejarDatosSensor);

                    document.getElementById('dotStatus').classList.add('connected');
                    document.getElementById('textConexion').innerText = "Conectado";
                    document.getElementById('btnConectar').innerText = "Desconectar";
                    document.getElementById('btnConectar').className = "btn-danger";
                    document.getElementById('logEstado').innerText = "Enlace Bluetooth establecido correctamente.";
                } catch (error) {
                    console.error(error);
                    document.getElementById('logEstado').innerText = "Error de enlace: " + error;
                }
            } else {
                if (bluetoothDevice.gatt.connected) {
                    bluetoothDevice.gatt.disconnect();
                }
                document.getElementById('dotStatus').classList.remove('connected');
                document.getElementById('textConexion').innerText = "Desconectado";
                document.getElementById('btnConectar').innerText = "Conectar";
                document.getElementById('btnConectar').className = "btn-primary";
                document.getElementById('logEstado').innerText = "Dispositivo desconectado.";
            }
        }

        async function enviarComando(comando) {
            if (!bluetoothCharacteristic) {
                alert("Primero debe conectar el sistema vía Bluetooth.");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(comando));
                document.getElementById('logEstado').innerText = "Comando enviado: " + comando;
            } catch (error) {
                console.error(error);
                document.getElementById('logEstado').innerText = "Error al enviar comando.";
            }
        }

        function manejarDatosSensor(event) {
            const value = new TextDecoder().decode(event.target.value);
            document.getElementById('logEstado').innerText = "Datos recibidos: " + value;
            
            if(value.includes("E:") && value.includes("S:")) {
                const partes = value.split(',');
                const entradas = partes[0].replace('E:', '');
                const salidas = partes[1].replace('S:', '');
                document.getElementById('valEntradas').innerText = entradas;
                document.getElementById('valSalidas').innerText = salidas;
            }
        }
    </script>
</body>
</html>
